
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Secure Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(92, 64, 255, .25), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(0, 200, 255, .18), transparent 35%),
        #070711;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .orb {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .18;
      pointer-events: none;
    }

    .orb.one {
      background: #6847ff;
      top: -120px;
      left: -100px;
    }

    .orb.two {
      background: #00c8ff;
      bottom: -150px;
      right: -100px;
    }

    .container {
      width: min(430px, calc(100% - 32px));
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(18, 18, 31, .78);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 30px;
      padding: 34px;
      box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.06);
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7557ff, #26c7ff);
      box-shadow: 0 15px 40px rgba(89, 76, 255, .35);
    }

    .logo svg {
      width: 31px;
      height: 31px;
      fill: white;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: -.7px;
    }

    .subtitle {
      text-align: center;
      color: #9999aa;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .label {
      display: block;
      font-size: 13px;
      color: #aaaaba;
      margin-bottom: 9px;
    }

    .phone-wrapper {
      display: flex;
      gap: 9px;
    }

    .country {
      width: 82px;
      height: 54px;
      border-radius: 15px;
      background: #10101d;
      border: 1px solid #29293a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 54px;
      border-radius: 15px;
      border: 1px solid #29293a;
      background: #10101d;
      color: white;
      outline: none;
      padding: 0 16px;
      font-size: 16px;
      transition: .2s;
    }

    input:focus {
      border-color: #6955ff;
      box-shadow: 0 0 0 4px rgba(105,85,255,.10);
    }

    #phone {
      flex: 1;
    }

    button {
      border: 0;
      cursor: pointer;
      color: white;
      font-weight: 600;
      font-size: 15px;
      transition: .2s;
    }

    .primary {
      width: 100%;
      height: 55px;
      margin-top: 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, #7358ff, #397dff);
      box-shadow: 0 15px 35px rgba(79, 89, 255, .25);
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 45px rgba(79, 89, 255, .35);
    }

    .primary:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .security {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      color: #777789;
      font-size: 12px;
    }

    .security svg {
      width: 14px;
      height: 14px;
      fill: #777789;
    }

    #otpScreen {
      display: none;
    }

    .back {
      background: transparent;
      color: #9999aa;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .back:hover {
      color: white;
    }

    .otp-container {
      display: flex;
      gap: 9px;
      justify-content: center;
      margin: 25px 0;
    }

    .otp {
      width: 49px;
      height: 57px;
      text-align: center;
      padding: 0;
      font-size: 21px;
      font-weight: 700;
      border-radius: 14px;
    }

    .otp:focus {
      border-color: #7358ff;
    }

    .otp-info {
      text-align: center;
      color: #8d8d9e;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .otp-info strong {
      color: white;
    }

    .resend {
      display: block;
      margin: 16px auto 0;
      background: transparent;
      color: #7d68ff;
      font-size: 13px;
    }

    .resend:disabled {
      color: #555566;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 13px;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.4;
    }

    .error {
      background: rgba(255,70,90,.10);
      border: 1px solid rgba(255,70,90,.18);
      color: #ff8290;
    }

    .success {
      background: rgba(50,220,150,.10);
      border: 1px solid rgba(50,220,150,.18);
      color: #55e4aa;
    }

    #recaptcha-container {
      margin-top: 12px;
    }

    .loader {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media(max-width:480px) {
      .card {
        padding: 26px 20px;
        border-radius: 25px;
      }

      h1 {
        font-size: 25px;
      }

      .otp {
        width: 43px;
        height: 53px;
      }
    }
  </style>
</head>

<body>

  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="container">

    <!-- PHONE SCREEN -->
    <section class="card" id="phoneScreen">

      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M6.6 10.8c1.5 3 3.6 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.7 3.8.7.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.3 21 3 12.7 3 2.7c0-.6.4-1 1-1h3.3c.6 0 1 .4 1 1 0 1.3.2 2.6.7 3.8.1.4 0 .8-.2 1.1l-2.2 2.2z"/>
        </svg>
      </div>

      <h1>Welcome back</h1>

      <p class="subtitle">
        Enter your phone number to continue.<br>
        We'll send you a secure verification code.
      </p>

      <label class="label">Phone Number</label>

      <div class="phone-wrapper">
        <div class="country">🇮🇳 +91</div>
        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          maxlength="10"
          placeholder="98765 43210"
        >
      </div>

      <div id="recaptcha-container"></div>

      <button class="primary" id="sendOtp">
        Continue
      </button>

      <div class="message error" id="phoneError"></div>

      <div class="security">
        <svg viewBox="0 0 24 24">
          <path d="M12 2 4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3zm0 5a2 2 0 0 1 2 2v1h-4V9a2 2 0 0 1 2-2zm4 9h-8v-5h8v5z"/>
        </svg>
        Your phone number is securely protected
      </div>

    </section>


    <!-- OTP SCREEN -->
    <section class="card" id="otpScreen">

      <button class="back" id="backButton">
        ← Change phone number
      </button>

      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M17 1H7C5.9 1 5 1.9 5 3v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm-5 20c-.8 0-1.5-.7-1.5-1.5S11.2 18 12 18s1.5.7 1.5 1.5S12.8 21 12 21zm5-4H7V4h10v13z"/>
        </svg>
      </div>

      <h1>Verify your number</h1>

      <p class="subtitle">
        Enter the 6-digit code sent to<br>
        <strong id="displayPhone"></strong>
      </p>

      <div class="otp-container">
        <input class="otp" maxlength="1" inputmode="numeric">
        <input class="otp" maxlength="1" inputmode="numeric">
        <input class="otp" maxlength="1" inputmode="numeric">
        <input class="otp" maxlength="1" inputmode="numeric">
        <input class="otp" maxlength="1" inputmode="numeric">
        <input class="otp" maxlength="1" inputmode="numeric">
      </div>

      <div class="otp-info">
        Didn't receive the code?
        <span id="timer">00:30</span>
      </div>

      <button class="primary" id="verifyOtp">
        Verify & Continue
      </button>

      <button class="resend" id="resendOtp" disabled>
        Resend OTP
      </button>

      <div class="message error" id="otpError"></div>
      <div class="message success" id="otpSuccess"></div>

    </section>

  </main>


  <script type="module">

    import {
      auth,
      RecaptchaVerifier,
      signInWithPhoneNumber
    } from "./firebase.js";

    const phoneScreen = document.getElementById("phoneScreen");
    const otpScreen = document.getElementById("otpScreen");

    const phoneInput = document.getElementById("phone");
    const sendOtpButton = document.getElementById("sendOtp");

    const verifyButton = document.getElementById("verifyOtp");
    const resendButton = document.getElementById("resendOtp");

    const displayPhone = document.getElementById("displayPhone");

    const phoneError = document.getElementById("phoneError");
    const otpError = document.getElementById("otpError");
    const otpSuccess = document.getElementById("otpSuccess");

    const otpInputs = document.querySelectorAll(".otp");

    let confirmationResult = null;
    let resendTimer = null;
    let seconds = 30;

    // ==========================================
    // RECAPTCHA
    // ==========================================

    window.recaptchaVerifier = new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {
        size: "normal",
        callback: () => {
          console.log("reCAPTCHA verified");
        },
        "expired-callback": () => {
          showError(
            phoneError,
            "reCAPTCHA expired. Please verify again."
          );
        }
      }
    );

    // ==========================================
    // SEND OTP
    // ==========================================

    sendOtpButton.addEventListener("click", async () => {

      hideMessage(phoneError);

      let phone = phoneInput.value.replace(/\D/g, "");

      if (phone.length !== 10) {
        showError(
          phoneError,
          "Please enter a valid 10-digit Indian phone number."
        );
        return;
      }

      phone = "+91" + phone;

      try {

        setButtonLoading(
          sendOtpButton,
          "Sending OTP..."
        );

        confirmationResult =
          await signInWithPhoneNumber(
            auth,
            phone,
            window.recaptchaVerifier
          );

        displayPhone.textContent =
          "+91 " + phone.slice(3);

        phoneScreen.style.display = "none";
        otpScreen.style.display = "block";

        otpInputs[0].focus();

        startTimer();

      } catch (error) {

        console.error(error);

        showError(
          phoneError,
          getFirebaseError(error)
        );

        try {
          window.recaptchaVerifier.clear();
        } catch {}

        window.recaptchaVerifier =
          new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {
              size: "normal"
            }
          );

      } finally {

        resetButton(
          sendOtpButton,
          "Continue"
        );

      }

    });


    // ==========================================
    // OTP INPUT
    // ==========================================

    otpInputs.forEach((input, index) => {

      input.addEventListener("input", () => {

        input.value =
          input.value.replace(/\D/g, "");

        if (input.value && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }

      });

      input.addEventListener("keydown", (e) => {

        if (
          e.key === "Backspace" &&
          !input.value &&
          index > 0
        ) {
          otpInputs[index - 1].focus();
        }

      });

      input.addEventListener("paste", (e) => {

        e.preventDefault();

        const pasted =
          e.clipboardData
            .getData("text")
            .replace(/\D/g, "")
            .slice(0, 6);

        pasted.split("").forEach((digit, i) => {
          if (otpInputs[i]) {
            otpInputs[i].value = digit;
          }
        });

        otpInputs[
          Math.min(pasted.length, 5)
        ].focus();

      });

    });


    // ==========================================
    // VERIFY OTP
    // ==========================================

    verifyButton.addEventListener(
      "click",
      async () => {

        hideMessage(otpError);
        hideMessage(otpSuccess);

        const code =
          [...otpInputs]
            .map(input => input.value)
            .join("");

        if (code.length !== 6) {

          showError(
            otpError,
            "Please enter the complete 6-digit OTP."
          );

          return;
        }

        try {

          setButtonLoading(
            verifyButton,
            "Verifying..."
          );

          const result =
            await confirmationResult.confirm(code);

          const user = result.user;

          console.log("Logged in:", user);

          showSuccess(
            otpSuccess,
            "Login successful. Redirecting..."
          );

          /*
             ======================================
             REDIRECT AFTER LOGIN
             ======================================

             Create dashboard.html and uncomment:

             setTimeout(() => {
               window.location.href = "dashboard.html";
             }, 1000);

             ======================================
          */

        } catch (error) {

          console.error(error);

          showError(
            otpError,
            getFirebaseError(error)
          );

        } finally {

          resetButton(
            verifyButton,
            "Verify & Continue"
          );

        }

      }
    );


    // ==========================================
    // RESEND OTP
    // ==========================================

    resendButton.addEventListener(
      "click",
      async () => {

        const phone =
          "+91" +
          phoneInput.value.replace(/\D/g, "");

        hideMessage(otpError);

        try {

          resendButton.disabled = true;

          confirmationResult =
            await signInWithPhoneNumber(
              auth,
              phone,
              window.recaptchaVerifier
            );

          showSuccess(
            otpSuccess,
            "A new OTP has been sent."
          );

          otpInputs.forEach(
            input => input.value = ""
          );

          otpInputs[0].focus();

          startTimer();

        } catch (error) {

          showError(
            otpError,
            getFirebaseError(error)
          );

          resendButton.disabled = false;

        }

      }
    );


    // ==========================================
    // BACK
    // ==========================================

    document
      .getElementById("backButton")
      .addEventListener("click", () => {

        otpScreen.style.display = "none";
        phoneScreen.style.display = "block";

        clearInterval(resendTimer);

      });


    // ==========================================
    // TIMER
    // ==========================================

    function startTimer() {

      seconds = 30;

      resendButton.disabled = true;

      updateTimer();

      clearInterval(resendTimer);

      resendTimer =
        setInterval(() => {

          seconds--;

          updateTimer();

          if (seconds <= 0) {

            clearInterval(resendTimer);

            resendButton.disabled = false;

          }

        }, 1000);

    }

    function updateTimer() {

      document.getElementById("timer")
        .textContent =
        `00:${String(seconds).padStart(2, "0")}`;

    }


    // ==========================================
    // UI HELPERS
    // ==========================================

    function setButtonLoading(button, text) {

      button.disabled = true;

      button.innerHTML =
        `<span class="loader"></span>${text}`;

    }

    function resetButton(button, text) {

      button.disabled = false;
      button.textContent = text;

    }

    function showError(element, message) {

      element.textContent = message;
      element.style.display = "block";

    }

    function showSuccess(element, message) {

      element.textContent = message;
      element.style.display = "block";

    }

    function hideMessage(element) {

      element.style.display = "none";

    }


    // ==========================================
    // FIREBASE ERROR MESSAGES
    // ==========================================

    function getFirebaseError(error) {

      const code = error?.code || "";

      const messages = {

        "auth/invalid-phone-number":
          "The phone number is invalid.",

        "auth/too-many-requests":
          "Too many attempts. Please try again later.",

        "auth/invalid-verification-code":
          "Incorrect OTP. Please check and try again.",

        "auth/code-expired":
          "This OTP has expired. Please request a new one.",

        "auth/quota-exceeded":
          "SMS quota exceeded for this Firebase project.",

        "auth/captcha-check-failed":
          "reCAPTCHA verification failed. Please try again.",

        "auth/network-request-failed":
          "Network error. Please check your internet connection."

      };

      return messages[code] ||
        error?.message ||
        "Something went wrong. Please try again.";

    }

  </script>

</body>
</html>
